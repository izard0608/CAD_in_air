<!-- index.html -->
 <!DOCTYPE html> <!-- 声明文档类型 -->
 <html lang = "zh-CN"> 

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD_in_Air</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>


<body>
<!-- 顶部导航栏的相关显示内容，按钮，文字等 -->
<div id="app">
    <header class="control-bar">
        <div class="logo">
            <h1>CAD_in_Air(手势实时建模系统)</h1>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn btn-primary">开始建模</button>
            <button id="btn-stop" class="btn btn-danger" disabled>结束建模</button>
            <button id="btn-reset" class="btn btn-secondary">重置场景</button>
        </div>
        <div class="status-indicators">
            <div class="status-item">
                <span class="status-label">连接状态:</span>
                <span id="connection-status" class="status-offline">离线</span>
            </div>
            <div class="status-item">
                <span class="status-label">建模状态:</span>
                <span id="modeling-status" class="status-inactive">未开始</span>
            </div>
        </div>
    </header>


        <!-- 主要内容区域 -->
        <main class="main-content">
            <!-- 左侧：摄像头画面和基本信息 -->
            <div class="left-panel">
                <div class="camera-container">
                    <h3>实时手部画面</h3>
                    <div class="camera-feed">
                        <!-- 使用 iframe 显示视频流 -->
                        <iframe id="camera-video" 
                                src="http://localhost:5001/video_feed"
                                style="width: 100%; height: 360px; border: none; border-radius: 8px;"
                                allow="camera">
                        </iframe>
                        <div id="camera-overlay" class="camera-overlay" style="display: none;">
                            <div class="overlay-text">
                                <div>视频流连接中...</div>
                                <button onclick="app.cameraManager.startCamera()" 
                                        style="margin-top: 10px; padding: 8px 16px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
                                    重新连接
                                </button>
                            </div>
                        </div>
                    </div>
                    <div style="margin-top: 10px; text-align: center; font-size: 12px; color: #666;">
                        视频源: 后端摄像头处理程序 | 端口: 5001
                    </div>
                </div>

                <div class="info-panel">
                    <h3>系统信息</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <label>数据包:</label>
                            <span id="packet-count">0</span>
                        </div>
                        <div class="info-item">
                            <label>延迟:</label>
                            <span id="latency">0ms</span>
                        </div>
                        <div class="info-item">
                            <label>FPS:</label>
                            <span id="fps">0</span>
                        </div>
                        <div class="info-item">
                            <label>手势状态:</label>
                            <span id="gesture-state">等待数据...</span>
                        </div>
                    </div>
                </div>
            </div>


<!-- 右侧面板，等待three.js渲染 -->
        <div class="right-panel">
            <div class="modeling-container">
                <h3>3D建模界面</h3>
                <div id="modeling-scene" class="modeling-scene">
                    <!-- Three.js画布将在这里渲染 -->
                    <div class="scene-overlay">
                        <div class="overlay-content">
                            <h4>3D建模画布</h4>
                            <p>建模会话开始后，这里将显示实时3D模型</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>


<!-- 底部状态栏 -->
<footer class="status-bar">
    <div class="status-left">
        <span>会话ID: <span id="session-id">未开始</span></span>
    </div>
    <div class="status-center">
        <span id="operation-hint">请点击"开始建模"按钮启动手势识别</span>
    </div>
    <div class="status-right">
        <span>连接客户端: <span id="client-count">0</span></span>
    </div>
</footer>


<!-- 引入js文件 -->
    <!-- Three.js 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Socket.io 客户端 -->
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    
    <!-- 项目JS文件 -->
    <script src="{{ url_for('static', filename='js/websocket-client.js') }}"></script>
    <script src="{{ url_for('static', filename='js/three-scene.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
